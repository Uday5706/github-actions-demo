name: CI workflow
on:
    push:
        branches: [main] # Trigger the workflow on push to the main branch
jobs:
    build: # Job name
        runs-on: ubuntu-latest # Github Runner environment
        steps:
            - name: Checkout Code in repository # Code Step
              uses: actions/checkout@v4 # Checks out the repository under $GITHUB_WORKSPACE, so your job can access it
            - name: Setup Docker # Build Step
              uses: docker/setup-buildx-action@v4 # Sets up Docker for use in actions
              
            - uses: docker/login-action@v2 # Login to Docker Hub
              with:
                username: ${{ secrets.DOCKERHUB_USERNAME }} # Docker Hub username stored in GitHub Secrets
                password: ${{ secrets.DOCKERHUB_TOKEN }} # Docker Hub password stored in GitHub Secrets

            - name: Build and Push Docker Image # Build and Push Step
              uses: docker/build-push-action@v4 # Builds and pushes Docker images
              with:
                context: ./backend # Context for the build (current directory)
                push: true # Push the image to the registry
                tags: ${{ secrets.DOCKERHUB_USERNAME }}/skillpulse-backend:Uday # Tag for the Docker image