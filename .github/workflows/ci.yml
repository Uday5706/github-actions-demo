name: CI workflow
on:
    push:
        branches: [main] # Trigger the workflow on push to the main branch
jobs:
    build: # Job name
        runs-on: ubuntu-latest # Github Runner environment
        steps:
            - name: Checkout Code in repository # Code Step
              uses: actions/checkout@v4 # Checks out the repository under $GITHUB_WORKSPACE, so your job can access it
            - name: Setup Docker # Build Step
              uses: docker/setup-buildx-action@v4 # Sets up Docker for use in actions
              